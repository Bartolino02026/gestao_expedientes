<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tramitações - Gestão de Expedientes</title>
    <style> body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 95%;
        max-width: 1200px;
        margin: 40px auto;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    h1 {
        margin: 0 0 8px 0;
        color: #343a40;
    }

    .descricao {
        color: #6c757d;
        margin-bottom: 25px;
    }

    .tabela {
        width: 100%;
        border-collapse: collapse;
    }

    .tabela th, .tabela td {
        padding: 12px;
        border-bottom: 1px solid #dee2e6;
        text-align: left;
    }

    .tabela th {
        background-color: #f8f9fa;
        color: #343a40;
    }

    .tabela tr:hover {
        background-color: #f8f9fa;
    }

    .vazio {
        text-align: center;
        color: #6c757d;
        padding: 30px;
    }

    .voltar {
        display: inline-block;
        margin-top: 25px;
        padding: 10px 18px;
        background-color: #6c757d;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
    }

    .voltar:hover {
        opacity: 0.85;
    }

    .novo {
        display: inline-block;
        margin-bottom: 20px;
        padding: 10px 18px;
        background-color: #198754;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
    }

    .novo:hover {
        opacity: 0.85;
    }

    </style>
</head>
<body>
<div class="container">
    <div class="card"><h1>Tramitações</h1>
        <p class="descricao"> Histórico de encaminhamento e movimentação dos expedientes. </p>
        <a href="/tramitacoes/novo" class="novo">
            + Nova Tramitação
        </a>
        <table class="tabela">
            <thead>
            <tr>
                <th>ID</th>
                <th>Expediente</th>
                <th>Utilizador</th>
                <th>Destino</th>
                <th>Data</th>
                <th>Observação</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="tramitacao : ${tramitacoes}">
                <td th:text="${tramitacao.id}"></td>
                <td>
    <span th:each="expediente : ${expedientes}"
          th:if="${expediente.id == tramitacao.expedienteId}"
          th:text="${expediente.numero + ' - ' + expediente.assunto}">
    </span>
                </td>
                <td>
    <span th:each="utilizador : ${utilizadores}"
          th:if="${utilizador.id == tramitacao.utilizadorId}"
          th:text="${utilizador.nome}">
    </span>
                </td>
                <td th:text="${tramitacao.destino}"></td>
                <td th:text="${#temporals.format(tramitacao.data, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${tramitacao.observacao}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(tramitacoes)}">
                <td colspan="6" class="vazio"> Não existem tramitações registadas.</td>
            </tr>
            </tbody>
        </table>
        <a href="/" class="voltar"> Voltar ao Dashboard </a></div>
</div>
</body>
</html>
