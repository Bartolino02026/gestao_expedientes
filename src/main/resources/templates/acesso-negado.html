<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Negado - Gestão de Expedientes</title>
    <style> body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        width: 420px;
        max-width: 90%;
        background: white;
        padding: 40px;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
    }

    .codigo {
        font-size: 64px;
        font-weight: bold;
        color: #dc3545;
        margin-bottom: 10px;
    }

    h1 {
        margin: 0 0 15px 0;
        color: #343a40;
    }

    p {
        color: #6c757d;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    .botao {
        display: inline-block;
        padding: 11px 20px;
        background-color: #0d6efd;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
    }

    .botao:hover {
        opacity: 0.85;
    } </style>
</head>
<body>
<div class="container">
    <div class="codigo">403</div>
    <h1>Acesso Negado</h1>
    <p> Não possui permissões suficientes para aceder a esta página. Contacte o administrador do sistema caso necessite
        de acesso. </p> <a href="/" class="botao"> Voltar ao Dashboard </a></div>
</body>
</html>
