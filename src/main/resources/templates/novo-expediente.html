<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Expediente - Gestão de Expedientes</title>
    <style> body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 90%;
        max-width: 800px;
        margin: 30px auto;
    }

    .header {
        background: white;
        padding: 25px;
        border-radius: 8px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .header h1 {
        margin: 0 0 8px 0;
    }

    .header p {
        margin: 0;
        color: #666;
    }

    .formulario {
        background: white;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .campo {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
        font-size: 14px;
    }

    textarea {
        resize: vertical;
    }

    .acoes {
        margin-top: 25px;
        display: flex;
        gap: 10px;
    }

    button, .botao-voltar {
        padding: 10px 18px;
        border: none;
        border-radius: 5px;
        text-decoration: none;
        cursor: pointer;
        font-size: 14px;
    }

    button {
        background-color: #198754;
        color: white;
    }

    .botao-voltar {
        background-color: #6c757d;
        color: white;
    } </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>Novo Expediente</h1>
        <p>Registo de um novo expediente no sistema.</p></div>
    <div class="formulario">
        <form th:action="@{/expedientes/salvar}" th:object="${expediente}" method="post">
            <div class="campo"><label for="numero">Número do Expediente:</label> <input type="text" id="numero"
                                                                                        th:field="*{numero}" required>
            </div>
            <div class="campo"><label for="assunto">Assunto:</label> <input type="text" id="assunto"
                                                                            th:field="*{assunto}" required></div>
            <div class="campo"><label for="remetente">Remetente:</label> <input type="text" id="remetente"
                                                                                th:field="*{remetente}"></div>
            <div class="campo"><label for="destinatario">Destinatário:</label> <input type="text" id="destinatario"
                                                                                      th:field="*{destinatario}"></div>
            <div class="campo"><label for="dataEntrada">Data de Entrada:</label> <input type="date" id="dataEntrada"
                                                                                        th:field="*{dataEntrada}"
                                                                                        required></div>
            <div class="campo"><label for="estado">Estado:</label> <select id="estado" th:field="*{estado}">
                <option value="RECEBIDO">Recebido</option>
                <option value="EM_TRAMITACAO">Em tramitação</option>
                <option value="DESPACHADO">Despachado</option>
                <option value="ARQUIVADO">Arquivado</option>
            </select></div>
            <div class="campo"><label for="observacao">Observação:</label> <textarea id="observacao"
                                                                                     th:field="*{observacao}"
                                                                                     rows="5"></textarea></div>
            <div class="acoes">
                <button type="submit"> Guardar Expediente</button>
                <a href="/expedientes" class="botao-voltar"> Voltar para a lista </a></div>
        </form>
    </div>
</div>
</body>
</html>
